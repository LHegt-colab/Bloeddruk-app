<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bloeddruk app</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f6fb;
        color: #1f2937;
      }

      .card {
        background: #ffffff;
        padding: 2.5rem 3rem;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
        text-align: center;
        max-width: 480px;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 2rem;
      }

      p {
        margin: 0;
        font-size: 1.1rem;
        color: #4b5563;
      }

      form {
        display: grid;
        gap: 0.75rem;
        margin-top: 1.5rem;
        text-align: left;
      }

      label {
        font-weight: 600;
        color: #374151;
      }

      input,
      textarea {
        width: 100%;
        padding: 0.6rem 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 1rem;
        font-family: inherit;
        background: #f9fafb;
      }

      textarea {
        resize: vertical;
      }

      button {
        margin-top: 0.5rem;
        padding: 0.75rem 1rem;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: #ffffff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      .message {
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 10px;
        font-size: 0.95rem;
      }

      .message--error {
        background: #fee2e2;
        color: #991b1b;
      }

      .message--success {
        background: #dcfce7;
        color: #166534;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Bloeddruk app</h1>
      <p>Mijn eerste werkende webpagina</p>
      <form id="bp-form" novalidate>
        <label for="datum">Datum</label>
        <input id="datum" name="datum" type="date" required />

        <label for="tijd">Tijd</label>
        <input id="tijd" name="tijd" type="time" required />

        <label for="bovendruk">Bovendruk</label>
        <input id="bovendruk" name="bovendruk" type="number" min="0" required />

        <label for="onderdruk">Onderdruk</label>
        <input id="onderdruk" name="onderdruk" type="number" min="0" required />

        <label for="hartslag">Hartslag</label>
        <input id="hartslag" name="hartslag" type="number" min="0" />

        <label for="notities">Notities</label>
        <textarea id="notities" name="notities" rows="3" placeholder="Optioneel"></textarea>

        <button type="submit">Opslaan</button>
      </form>
      <p id="form-error" class="message message--error" role="alert" hidden></p>
      <p id="form-success" class="message message--success" hidden></p>
    </main>
    <script>
      const form = document.getElementById("bp-form");
      const datumInput = document.getElementById("datum");
      const tijdInput = document.getElementById("tijd");
      const bovendrukInput = document.getElementById("bovendruk");
      const onderdrukInput = document.getElementById("onderdruk");
      const hartslagInput = document.getElementById("hartslag");
      const errorMessage = document.getElementById("form-error");
      const successMessage = document.getElementById("form-success");

      const now = new Date();
      datumInput.value = now.toISOString().slice(0, 10);
      tijdInput.value = now.toTimeString().slice(0, 5);

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        errorMessage.hidden = true;
        successMessage.hidden = true;

        if (!bovendrukInput.value || !onderdrukInput.value) {
          errorMessage.textContent =
            "Vul zowel bovendruk als onderdruk in.";
          errorMessage.hidden = false;
          return;
        }

        const bovendruk = Number(bovendrukInput.value);
        const onderdruk = Number(onderdrukInput.value);

        if (bovendruk <= onderdruk) {
          errorMessage.textContent =
            "Bovendruk moet hoger zijn dan onderdruk.";
          errorMessage.hidden = false;
          return;
        }

        const hartslag = hartslagInput.value
          ? `, pols ${hartslagInput.value}`
          : "";
        const datum = datumInput.value;
        const tijd = tijdInput.value;

        successMessage.textContent = `Opgeslagen (nog niet echt): ${bovendruk}/${onderdruk}${hartslag} op ${datum} ${tijd}`;
        successMessage.hidden = false;
      });
    </script>
  </body>
</html>
