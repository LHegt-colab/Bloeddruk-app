<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bloeddruk app</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f6fb;
        color: #1f2937;
      }

      .card {
        background: #ffffff;
        padding: 2.5rem 3rem;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
        text-align: center;
        max-width: 480px;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 2rem;
      }

      p {
        margin: 0;
        font-size: 1.1rem;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Bloeddruk app</h1>
      <p>Mijn eerste werkende webpagina</p>
    </main>
  </body>
</html>
